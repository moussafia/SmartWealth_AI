# ═══════════════════════════════════════════════════════════════
# SmartWealth AI — Docker Compose
# ═══════════════════════════════════════════════════════════════
# This file describes ALL the infrastructure containers.
# One command "docker compose up -d" starts everything.
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────
  # PostgreSQL for User Service
  # ────────────────────────────────a─────────
  # PostgreSQL is a relational database (like MySQL, but more powerful).
  # Each microservice gets its OWN database — this is the
  # "Database-per-Service" pattern. Why? If User Service's DB crashes,
  # Portfolio Service keeps working.
  postgres-user:
    image: postgres:16-alpine
    # "image" = which software to download from Docker Hub
    # "postgres:16" = PostgreSQL version 16
    # "-alpine" = based on Alpine Linux (tiny: ~80MB instead of ~400MB)
    container_name: postgres-user
    # "container_name" = friendly name you'll see in Docker Desktop
    # and use in logs. Without it, Docker generates a random name.
    restart: unless-stopped
    # "restart" policy:
    #   - "no" = never restart (default)
    #   - "unless-stopped" = restart if it crashes, but not if YOU stopped it
    #   - "always" = restart even if you stopped it manually
    environment:
      POSTGRES_DB: userdb
      # Creates a database called "userdb" automatically on first start.
      # Without this, you'd have to CREATE DATABASE manually.
      POSTGRES_USER: admin
      # The superuser username for this PostgreSQL instance.
      POSTGRES_PASSWORD: admin123
      # The password. In production, you'd use Docker Secrets or .env files.
    ports:
      - "5432:5432"
      # Format: "HOST_PORT:CONTAINER_PORT"
      # Your PC's port 5432 → container's port 5432
      # This means: in IntelliJ or any app on your PC,
      # connect to localhost:5432 to reach this PostgreSQL.
    volumes:
      - user-db-data:/var/lib/postgresql/data
      # "volumes" = persistent storage
      # Without this: if you run "docker compose down", ALL your data is GONE.
      # With this: data is saved on your hard drive in a Docker-managed folder.
      # "user-db-data" is just a name we chose (defined below in the volumes section).
      # "/var/lib/postgresql/data" is where PostgreSQL stores its files INSIDE the container.
    networks:
      - smartwealth-net

  # ─────────────────────────────────────────
  # pgAdmin — Database visual manager
  # ─────────────────────────────────────────
  # pgAdmin is a web app that lets you see your tables, run SQL queries,
  # and browse data visually. Like a "file explorer" for your database.
  # This is OPTIONAL but very helpful during development.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smart.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      # These are the LOGIN credentials for the pgAdmin web interface,
      # NOT the database credentials (those are above in postgres-user).
    ports:
      - "5050:80"
      # pgAdmin runs on port 80 inside the container.
      # We map it to 5050 on your PC so it doesn't conflict with anything.
      # Open http://localhost:5050 in your browser to use it.
    networks:
      - smartwealth-net
    depends_on:
      - postgres-user
      # "depends_on" = start postgres-user BEFORE pgadmin.
      # pgAdmin needs the database to exist first.

  postgres-portfolio:
    image: postgres:16-alpine
    container_name: postgres-portfolio
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfoliodb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"      # 5433 on your PC (5432 is taken by user DB)
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    networks:
      - smartwealth-net

    # ─────────────────────────────────────────
    # PostgreSQL for Keycloak
    # ─────────────────────────────────────────
    # Keycloak needs its own database to store realms, clients, users,
    # roles, and sessions. Following the same "database-per-service"
    # pattern you already used for postgres-user.
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - smartwealth-net
    # No "ports" mapping needed here — nothing outside Docker needs to
    # talk to this DB directly, only Keycloak itself (via the network).

  # ─────────────────────────────────────────
  # Keycloak — Identity & Access Management
  # ─────────────────────────────────────────
  # Keycloak is the "auth server". It issues JWT tokens after login,
  # stores users/roles, and your microservices trust its tokens instead
  # of each doing their own login/password checking.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    # "start-dev" = development mode (no HTTPS required, relaxed checks).
    # For production you'd use "start" with proper certs.
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloakdb
      # Note: "postgres-keycloak" here is the container name from above —
      # Docker's internal DNS resolves it, same trick you used for pgAdmin.
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      # Login for the Keycloak admin console (http://localhost:8181),
      # NOT a login for your app's end users.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8181:8080"
      # We use 8181 on your PC to avoid clashing with any of your
      # microservices that might already use 8080/8081/etc.
    depends_on:
      - postgres-keycloak
    networks:
      - smartwealth-net

  # ─────────────────────────────────────────
  # Kafka — the message broker
  # ─────────────────────────────────────────
  # Kafka is where events are published and read from.
  # Transaction Service PUBLISHES here; Portfolio Service READS from here.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"      # your PC → Kafka (apps running in IDE connect here)
    environment:
      # KRaft mode = no Zookeeper needed (modern Kafka)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - smartwealth-net

  # ─────────────────────────────────────────
  # Kafka UI — visual dashboard (optional but great for learning)
  # ─────────────────────────────────────────
  # Open http://localhost:8090 to SEE topics and messages live.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartwealth
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - smartwealth-net

# ─────────────────────────────────────────
# Volumes — Where data lives on your hard drive
# ─────────────────────────────────────────
# Think of volumes as USB drives that Docker manages.
# Even if you delete the container, the volume keeps the data.
volumes:
  user-db-data:
  keycloak-db-data:
  portfolio-db-data:
  # This creates a named volume called "user-db-data".
  # Docker stores it somewhere on your PC (you don't need to know where).
  # To delete it: "docker volume rm smart-walth-ai_user-db-data"

# ─────────────────────────────────────────
# Networks — How containers talk to each other
# ─────────────────────────────────────────
# Containers are isolated by default — they CAN'T see each other.
# A network connects them. On the same network, containers
# can use each other's NAME as a hostname.
# Example: from your Java app, connect to "postgres-user:5432"
# instead of "localhost:5432" (when running inside Docker).
networks:
  smartwealth-net:
    driver: bridge
    # "bridge" = the default network type.
    # Creates an isolated network where containers communicate by name.